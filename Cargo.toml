[package]
name = "redis-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# Cargo.lock pins instability 0.3.10, darling 0.20.11, and unicode-segmentation 1.12.0
# so ratatui builds on Rust 1.83.
redis = { version = "0.27", default-features = false }
# Pin url so Cargo.lock stays buildable on Rust 1.83 (avoids idna/icu edition2024).
url = "=2.5.2"
